# Blueprint de Render para el API.
# Se compila desde la RAÍZ del monorepo (los workspaces npm necesitan el
# package-lock de la raíz); no usar root packages/api como directorio raíz.
services:
  - type: web
    name: inscripciones-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate --schema packages/api/prisma/schema.prisma &&
      npm run build -w packages/infrastructure &&
      npm run build -w packages/api
    startCommand: >-
      npx prisma migrate deploy --schema packages/api/prisma/schema.prisma &&
      npm run start -w packages/api
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLIC_BUCKET
        value: public-assets
      - key: SUPABASE_PRIVATE_BUCKET
        value: certificate-templates
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
